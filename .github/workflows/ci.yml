name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS 26 / Xcode 26.6 / iPhone 17
    runs-on: macos-26
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR" || {
            echo "Pinned Xcode is missing: $DEVELOPER_DIR" >&2
            exit 1
          }
          sudo xcode-select --switch "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Run release readiness guard
        run: scripts/verify-release-readiness.sh

      - name: Run release readiness self-test
        run: scripts/test-verify-release-readiness.sh

      - name: Run Hourleaf simulator tests without signing
        shell: bash
        run: |
          set -euo pipefail

          simulator_name="iPhone 17"
          simulator_os="26.5"
          simulator_id="$(
            xcrun simctl list devices available | awk -v name="$simulator_name" -v os="$simulator_os" '
              /^-- iOS / { currentOS = $0; next }
              currentOS == "-- iOS " os " --" && $0 ~ "^    " name " \\(" {
                gsub(/[()]/, "", $3)
                print $3
                exit
              }
            '
          )"
          created_device=false

          if [[ -z "$simulator_id" ]]; then
            runtime_id="$(
              xcrun simctl list runtimes available | awk -v os="$simulator_os" '
                $0 ~ "^iOS " os " " {
                  for (field = 1; field <= NF; field++) {
                    if ($field ~ /^com.apple.CoreSimulator.SimRuntime\./) {
                      print $field
                      exit
                    }
                  }
                }
              '
            )"
            device_type_id="$(
              xcrun simctl list devicetypes | awk -F '[()]' -v name="$simulator_name" '
                {
                  device_name = $1
                  gsub(/[[:space:]]+$/, "", device_name)
                  if (device_name == name) { print $2; exit }
                }
              '
            )"
            [[ -n "$runtime_id" && -n "$device_type_id" ]] || {
              echo "Unable to find iOS $simulator_os runtime or $simulator_name device type" >&2
              exit 1
            }
            simulator_id="$(xcrun simctl create "$simulator_name" "$device_type_id" "$runtime_id")"
            created_device=true
          fi

          artifact_root="$(mktemp -d "$RUNNER_TEMP/hourleaf-ci.XXXXXX")"
          cleanup() {
            xcrun simctl shutdown "$simulator_id" >/dev/null 2>&1 || true
            if [[ "$created_device" == true ]]; then
              xcrun simctl delete "$simulator_id" >/dev/null 2>&1 || true
            fi
            rm -rf -- "$artifact_root"
          }
          trap cleanup EXIT

          xcrun simctl bootstatus "$simulator_id" -b
          xcodebuild test \
            -project Hourleaf.xcodeproj \
            -scheme Hourleaf \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -derivedDataPath "$artifact_root/DerivedData" \
            -resultBundlePath "$artifact_root/Hourleaf.xcresult" \
            -skip-testing:HourleafUITests/HourleafAppStoreScreenshotTests \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
